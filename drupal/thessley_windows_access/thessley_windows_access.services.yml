services:
  thessley_windows_access.store:
    class: Drupal\thessley_windows_access\WindowsAccessStore
    arguments: ['@database', '@datetime.time']

  thessley_windows_access.pam_protocol:
    class: Drupal\thessley_windows_access\PamProtocol

  thessley_windows_access.agent_protocol:
    class: Drupal\thessley_windows_access\AgentProtocol
    arguments: ['@thessley_windows_access.pam_protocol']

  logger.channel.thessley_windows_access:
    parent: logger.channel_base
    arguments: ['thessley_windows_access']
